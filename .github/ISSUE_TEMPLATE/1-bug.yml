name: Bug report
description: Report a problem with PadPlus (the macOS app). Not for Notepad++ on Windows.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for **PadPlus**, an independent macOS editor based on the Notepad++ source code.
        Problems with Notepad++ on Windows belong to the [Notepad++ project](https://github.com/notepad-plus-plus/notepad-plus-plus), not here.
  - type: input
    id: version
    attributes:
      label: PadPlus version
      description: Shown in "? > About PadPlus".
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.5, MacBook Air M2"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: How did you get the app?
      options:
        - Disk image from the Releases page
        - Built from source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Screenshots help. For a crash, attach the report from Console > Crash Reports.
    validations:
      required: true
