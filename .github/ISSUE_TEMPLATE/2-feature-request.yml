name: Feature request
description: Suggest something for PadPlus (the macOS app).
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [Known gaps](https://github.com/CristianVertiz/PadPlus/blob/macos/macos/README.md#known-gaps) first.
        Plugins cannot be supported: Notepad++ plugins are Windows DLLs.
  - type: textarea
    id: what
    attributes:
      label: What would you like PadPlus to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: If Notepad++ on Windows already does this, say where (menu and item).
